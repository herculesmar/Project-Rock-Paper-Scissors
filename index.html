<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="./index.js" defer></script>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="title">
        <div>Rock Paper Scissors</div>
    </div>
    <div class="comment"></div>
    <div class="score">
        <div class="player">
            <div>Player : </div>
            <div class="player_score"></div>
        </div>
        <div class="player_choice"></div>
        <img src="./images/vs.png">
        <div class="computer_choice"></div>
        <div class="computer">
            <div>Computer :  </div>
            <div class="computer_score"></div>
        </div>
    </div>
    <div class="choices">
        <button class="rock">
            <img src="./images/rock.jpeg">
        </button>
        <button class="paper">
            <img src="./images/paper.jpeg">
        </button>
        <button class="scissors">
            <img src="./images/scissors.jpeg">
        </button>
    </div>
    <div class="weapon">
        <div>
            Choose your weapon!
        </div>
    </div>
    <div class="roundtitle">
        <div>Round : </div>
        <div class="n_round"></div>
    </div>
    <div class="again">
        <button class = "play">Play again!</button>
    </div>

</body>
</html>
